experiment_id: group_multisite_31industry_core_v1
solver: gurobi
industry: null
production_load_site_count: registry_or_representative_group_case
max_modeled_routing_nodes: 5
ai_deployment_node_rule: same_as_modeled_routing_nodes
architectures: [IF, IG_1host, IG_multisite]
base_load_cases_by_architecture:
  IF: [actual_load]
  IG_1host: [actual_load, zero_load]
  IG_multisite: [actual_load]
integer_boundary:
  IF_installed_server_groups_integer: true
  IG_1host_installed_server_groups_integer: false
  IG_multisite_installed_server_groups_integer: false
  online_server_groups_integer: false
  planning_reserve_fraction: 0.15
  n_plus_spare_server_groups: 0
  model_state_minimum_groups_enabled: false
task_boundary:
  same_group_total_service: true
  task_origin_scope: all_registered_production_load_sites
  execution_node_scope: modeled_AI_deployment_routing_nodes
  AI_deployment_points_equal_routing_nodes: true
  all_six_core_tasks_group_routable: true
  flexible_jobs_keep_original_deadlines: true
  report_AI_power_decomposition: fixed_overhead_unshiftable_active_shiftable_active
  cross_factory_routing: IG_multisite_only
energy_boundary:
  pv_capacity_mode: none
  battery_investment_enabled: false
  same_provincial_hourly_price_at_all_factories: true
load_curve_selection:
  source: EWELD
  source_isic: auto_from_core_lineage
  rule: distinct_users_first_then_distinct_complete_weeks_until_modeled_routing_node_count
  proxy_rule: reuse_the_active_core_profile_source_isic_for_industries_without_direct_EWELD_samples
  scaling: production_load_registry_with_explicit_legacy_compatibility_for_uncalibrated_industries
  representative_sampling_rule: weighted_load_curves_reconstruct_all_production_sites_only_for_IF
  electrical_boundary: each_AI_node_uses_only_its_host_factory_load_no_cross_meter_aggregation
  ai_deployment_rule: one_AI_deployment_point_per_modeled_routing_node
  simultaneity: align_by_weekday_and_hour_not_same_calendar_week
  week_quality_by_industry:
    C36:
      minimum_monday_to_tuesday_friday_mean_ratio: 0.75
      maximum_weekday_daily_mean_cv: 0.35
      maximum_weekly_peak_to_mean_ratio: 3.0
counterfactual:
  architecture: IG_1host
  definition: zero_original_factory_load_reoptimized_minus_actual_load_reoptimized
  interpretation: value_of_cooptimizing_AI_with_the_fixed_host_factory_load_shape
interpretation: national_rerun_authorized_with_C36_calibrated_and_other_industries_explicit_legacy_compatibility_boundaries
